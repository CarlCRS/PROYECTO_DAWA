<div class="container py-4">
  <app-header></app-header>

  <button class="btn btn-dark d-block mx-auto mb-3" (click)="alternarMensaje()">
    Mostrar / Ocultar Mensaje
  </button>

  <div class="alert alert-secondary text-center mb-4" *ngIf="mostrarMensaje">
    <p class="mb-0">Bienvenidos a la primera parte del proyecto Gestion de Cursos</p>
  </div>

  <div class="row g-4">
    <div class="col-md-5">
      <app-cursos-form (cursoAgregado)="agregarCurso($event)"></app-cursos-form>
    </div>

    <div class="col-md-7">
      <app-cursos-list [cursos]="cursos"></app-cursos-list>
    </div>
  </div>

  <app-footer></app-footer>
</div>
